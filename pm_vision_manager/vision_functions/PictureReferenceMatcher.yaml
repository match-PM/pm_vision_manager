function_name: "PictureReferenceMatcher"
description: >-
  Finds an annotated feature from a reference image anywhere in the current
  image. Position is located globally and refined with focused chamfer matching;
  rotation is estimated independently from the reference context. Search
  pyramid, feature size, point sampling, coarse angle steps, and refinement
  windows are derived automatically from the reference and requested accuracy.
function_category: "Machine Vision"

params:
  - param_name: "active"
    description: "Activate or deactivate this function."
    type: "bool"
    default_val: true

  - param_name: "max_rotation_deg"
    description: "Largest expected absolute rotation from the reference, in degrees."
    type: "float"
    min_val: 0.0
    max_val: 180.0
    default_val: 10.0

  - param_name: "angle_accuracy_deg"
    description: "Final angular search resolution. Coarser search steps are derived automatically."
    type: "float"
    min_val: 0.001
    max_val: 1.0
    default_val: 0.01

  - param_name: "max_score_threshold"
    description: "Fail above this normalized chamfer score. The medium threshold is derived as one quarter of this value."
    type: "float"
    min_val: 0.0
    max_val: 1.0
    default_val: 0.002

  - param_name: "draw_reference"
    description: "Blend the matched reference over the image at a fixed readable opacity."
    type: "bool"
    default_val: true

  - param_name: "draw_lines"
    description: "Draw the matched reference border and keypoint axes."
    type: "bool"
    default_val: true
