function_name: "Save_Image"
description: >
  Saves selected images to the process database during execution mode only.
  Images are never saved in Vision Assistant or cross-validation mode.

function_category: "Image Tools"   # supported:
                                  # 'Image Processing', 'Machine Vision',
                                  # 'Camera Tools', 'Image Analysis',
                                  # 'Image Tools', 'Image Conversion'

params:
  - param_name: "active"
    description: >
      Enables or disables execution of this function. If set to false,
      no image will be saved.
    type: "bool"

  - param_name: "save_input_image"
    description: >
      Saves the unmodified input image. Multiple Save_Image functions use the
      same filename, so the input image is only stored once (or overwritten).
    type: "bool"
    default_val: true

  - param_name: "save_input_image_with_results"
    description: >
      Saves the input image with all vision-result overlays available at this
      point in the pipeline. Multiple Save_Image functions use the same file.
    type: "bool"
    default_val: true

  - param_name: "save_current_image"
    description: >
      Saves the current processing image exactly as it exists at this point in
      the pipeline. An automatic Save_Image occurrence prefix differentiates
      files when the pipeline contains multiple Save_Image functions.
    type: "bool"
    default_val: false
